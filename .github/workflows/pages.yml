# Publishes the static build to GitHub Pages.
#
# Needs Pages turned on for the repository with "GitHub Actions" as the source
# (Settings → Pages). Nothing else: the app has no server, so a project site at
# https://<owner>.github.io/<repo>/ is a complete deployment — GitHub sign-in is
# the one thing missing there, since that needs a serverless function, and the
# app falls back to a pasted token on its own.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A broken build is worse than a stale one.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
