[package]
name = "outliner"
version = "0.1.0"
description = "Local-first outliner — the native shell around the web build"
edition = "2021"
rust-version = "1.77.2"

[lib]
# `cdylib` is what the Android build links, `rlib` what `src/main.rs` links
# on desktop. `staticlib` is what an iOS build would link (iOS is out of
# scope, ADR-0010).
name = "outliner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

# Folder picking and the system-wide key are desktop features; the phone
# build does not carry them.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"

[profile.release]
# The shell is small and rarely rebuilt; spend the build time on size.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
